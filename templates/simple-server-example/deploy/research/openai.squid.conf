http_port 3128
visible_hostname research-egress-openai
pid_filename none
cache_log /dev/null
access_log none
cache_store_log none
cache deny all
coredump_dir /tmp
shutdown_lifetime 1 seconds
acl CONNECT method CONNECT
acl TLS_port port 443
acl provider dstdomain -n api.openai.com
acl private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
http_access deny !CONNECT
http_access deny !TLS_port
http_access deny !provider
http_access deny private
http_access allow provider
http_access deny all
forwarded_for delete
connect_timeout 10 seconds
request_timeout 15 seconds
read_timeout 110 seconds
